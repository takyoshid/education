<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投稿一覧 — 非同期フェッチ模範解答</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 24px; }
    .controls { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      padding: 8px 18px;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #0052a3; }
    button:focus-visible { outline: 3px solid #0066cc; outline-offset: 2px; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .status { color: #666; padding: 12px 0; min-height: 40px; }
    .error { color: #cc0000; border: 1px solid #cc0000; border-radius: 6px; padding: 12px; }
    .post {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }
    .post-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    .post-body { color: #555; font-size: 0.9rem; line-height: 1.5; }
    .post-meta { font-size: 0.8rem; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>投稿一覧</h1>

  <div class="controls">
    <label for="user-filter" style="font-weight:bold;">ユーザー:</label>
    <select id="user-filter" aria-label="ユーザーでフィルター">
      <option value="">すべてのユーザー</option>
    </select>
    <button id="load-btn">読み込む</button>
  </div>

  <div id="status" class="status" aria-live="polite">ボタンを押して読み込んでください。</div>
  <div id="post-list" role="list"></div>

  <script>
    "use strict";

    // ===== ユーティリティ =====

    /** XSS 対策: テキストを安全にエスケープする */
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    /**
     * fetch のラッパー: response.ok チェックと JSON パースを一括で行う
     * @template T
     * @param {string} url
     * @param {RequestInit} [options]
     * @returns {Promise<T>}
     */
    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      return response.json();
    }

    // ===== UI 要素の参照 =====
    const userFilter = document.getElementById("user-filter");
    const loadBtn    = document.getElementById("load-btn");
    const statusEl   = document.getElementById("status");
    const postList   = document.getElementById("post-list");

    // 現在進行中のリクエストをキャンセルするための AbortController
    let currentController = null;

    // ===== UI 操作関数 =====

    function setLoading(isLoading) {
      loadBtn.disabled = isLoading;
      if (isLoading) {
        statusEl.className = "status";
        statusEl.textContent = "読み込み中...";
      }
    }

    function showError(message) {
      statusEl.className = "error";
      statusEl.textContent = message;
      postList.innerHTML = "";
    }

    function showPosts(posts) {
      if (posts.length === 0) {
        statusEl.className = "status";
        statusEl.textContent = "投稿がありません。";
        postList.innerHTML = "";
        return;
      }
      statusEl.className = "status";
      statusEl.textContent = `${posts.length} 件の投稿を表示しています。`;
      postList.innerHTML = posts
        .map(post => `
          <article class="post" role="listitem">
            <h2 class="post-title">${escapeHtml(post.title)}</h2>
            <p class="post-body">${escapeHtml(post.body)}</p>
            <p class="post-meta">ユーザー ID: ${escapeHtml(post.userId)} / 投稿 ID: ${escapeHtml(post.id)}</p>
          </article>
        `)
        .join("");
    }

    // ===== データフェッチ =====

    /** ユーザー一覧を取得して select に追加する */
    async function loadUsers() {
      try {
        const users = await fetchJson("http://127.0.0.1:8787/users");
        users.forEach(user => {
          const option = document.createElement("option");
          option.value = String(user.id);
          option.textContent = user.name;
          userFilter.appendChild(option);
        });
      } catch (e) {
        // ユーザー取得失敗は軽微なエラーとして扱う
        console.warn("ユーザー一覧の取得に失敗しました:", e.message);
      }
    }

    /** 投稿一覧を取得して表示する */
    async function loadPosts() {
      // 前のリクエストがあればキャンセル
      if (currentController) {
        currentController.abort();
      }
      currentController = new AbortController();
      const { signal } = currentController;

      setLoading(true);

      try {
        const userId = userFilter.value;
        const url = userId
          ? `http://127.0.0.1:8787/posts?userId=${encodeURIComponent(userId)}`
          : "http://127.0.0.1:8787/posts";

        const posts = await fetchJson(url, { signal });
        showPosts(posts);
      } catch (e) {
        if (e.name === "AbortError") return; // キャンセルは正常系
        showError(`エラー: ${e.message}`);
      } finally {
        setLoading(false);
        currentController = null;
      }
    }

    // ===== イベント登録 =====
    loadBtn.addEventListener("click", loadPosts);

    // ページ初期化: ユーザー一覧を読み込む
    loadUsers();
  </script>
</body>
</html>
