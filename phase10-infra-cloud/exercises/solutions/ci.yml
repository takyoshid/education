# ============================================================
# 演習 04 参考解答: GitHub Actions CI/CD パイプライン
# ============================================================
#
# ファイルの配置場所: .github/workflows/ci.yml
#
# パイプラインの流れ:
#   push / PR → lint → test → build → security-scan
#
# 必要な GitHub Secrets:
#   DOCKERHUB_USERNAME : Docker Hub のユーザー名
#   DOCKERHUB_TOKEN    : Docker Hub のアクセストークン
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチで複数のワークフローが走った場合、古いものをキャンセルする
# PR に連続でプッシュしたとき、古いビルドが無駄に走らないようにするため
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------
  # ジョブ 1: lint（静的解析・フォーマット確認）
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip キャッシュで 2 回目以降のインストールを高速化
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-dev-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check (構文・スタイルチェック)
        run: ruff check .

      - name: Run ruff format check (フォーマットチェック)
        run: ruff format --check .

  # ----------------------------------------------------------
  # ジョブ 2: test（ユニットテスト）
  # ----------------------------------------------------------
  test:
    name: Test (pytest)
    needs: lint  # lint が成功した場合のみ実行する
    runs-on: ubuntu-latest

    # サービスコンテナ: テスト中に PostgreSQL を起動しておく
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # アプリ用と開発用の両方をキャッシュ
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      # カバレッジレポートをアーティファクトとして保存
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ----------------------------------------------------------
  # ジョブ 3: build（Docker イメージのビルドとプッシュ）
  # ----------------------------------------------------------
  build:
    name: Build Docker image
    needs: test  # test が成功した場合のみ実行する
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker Buildx を設定（マルチプラットフォームビルドやキャッシュ機能が使えるようになる）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # main ブランチへの push の場合のみ Docker Hub にログイン
      # PR では不要（テスト目的のビルドだけ行う）
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # イメージのタグ戦略:
      # - main ブランチ: latest タグ
      # - その他: コミット SHA を使った一意のタグ（PR のビルドはプッシュしない）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/my-fastapi-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # main ブランチへの push のときだけ Docker Hub にプッシュする
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions のキャッシュを使ってビルドを高速化
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------
  # ジョブ 4: security-scan（脆弱性スキャン）
  # ----------------------------------------------------------
  security-scan:
    name: Security scan (Trivy)
    needs: build  # build が成功した場合のみ実行する
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # スキャン用にイメージをビルド（Docker Hub からプルせずにローカルでビルド）
      - name: Build image for scanning
        run: docker build -t my-fastapi-app:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "my-fastapi-app:scan"
          format: "table"
          # CRITICAL/HIGH の脆弱性が見つかった場合にジョブを失敗させる
          exit-code: "1"
          # 修正版が存在しない脆弱性は無視する
          # （対処できないものを除外することで、対処すべき問題を明確にする）
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # SARIF 形式でレポートを出力し、GitHub Security タブに表示する（オプション）
      # （GitHub Advanced Security が有効な場合のみ利用可能）
      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: "trivy-results.sarif"
